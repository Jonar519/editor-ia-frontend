name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: lint · typecheck · tests · color · contraste · build · presupuestos · mutaciones · audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Auditoría de significado de color
        run: npm run colores
      - name: Contraste AA (temas claro y oscuro)
        run: npm run contraste
      - run: npm run build
      - name: Presupuestos (falla solo con topes confirmados)
        run: npm run presupuestos
      - run: npm run mutate
      - run: npm audit --audit-level=high

  e2e:
    name: e2e (Playwright + axe, contenedor oficial)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    env:
      TZ: UTC
      HOME: /root
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  gitleaks:
    name: gitleaks (historial completo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact -v
